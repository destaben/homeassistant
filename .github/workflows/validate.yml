name: Validate Configuration

on:
  push:
    branches: [main, master]
  pull_request:
    paths:
      - "ha/**/*.yaml"
      - "docker-compose.yaml"
      - "nginx/nginx.conf"

jobs:
  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint HA YAML files
        run: |
          yamllint -c .yamllint.yml \
            ha/configuration.yaml \
            ha/automations.yaml \
            ha/scripts.yaml \
            ha/scenes.yaml \
            ha/ui-lovelace.yaml

  docker-compose-validate:
    name: Docker Compose Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create dummy .env
        run: |
          echo "CLOUDFLARE_TUNNEL_TOKEN=dummy_token_for_ci" > .env

      - name: Validate docker-compose.yaml
        run: docker compose config --quiet

  ha-config-check:
    name: Home Assistant Config Check
    runs-on: ubuntu-latest
    # Device-registry references (device_id) only resolve in a live HA instance.
    # This job catches syntax and integration errors but device errors are expected.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Write HA version file
        run: echo "2026.2" > ha/.HA_VERSION

      - name: Create dummy secrets.yaml for CI
        run: cp ha/secrets.yaml.example ha/secrets.yaml

      - name: Run Home Assistant config check
        uses: frenck/action-home-assistant@v1
        with:
          path: ./ha
