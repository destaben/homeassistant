services:
  homeassistant:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:2026.2"
    volumes:
      - ./homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - apparmor:unconfined
      - no-new-privileges:true
    ports:
      - "8123:8123"
    networks:
      - homeassistant-net
    restart: always

  zigbee2mqtt:
    container_name: zigbee2mqtt
    image: koenkk/zigbee2mqtt:2.8.0
    restart: unless-stopped
    volumes:
        - ./data:/app/data
        - /run/udev:/run/udev:ro
    ports:
        - 8082:8080
    environment:
        - TZ=Europe/Madrid
    devices:
        - /dev/serial/by-id/usb-ITead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_fc0671e16fbeed119095a04838a92db5-if00-port0:/dev/ttyACM0
    networks:
      - homeassistant-net

  mosquitto:
    image: eclipse-mosquitto:2.0
    hostname: mosquitto
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./etc_mosquitto:/etc/mosquitto
      - ./mosquitto_config:/mosquitto/config/
    networks:
      - homeassistant-net

  appdaemon:
    container_name: appdaemon
    image: acockburn/appdaemon:4.4.2
    restart: unless-stopped
    volumes:
      - ./appdaemon:/conf
      - /etc/localtime:/etc/localtime:ro
    environment:
      - HA_URL=http://homeassistant:8123
      - TOKEN=${APPDAEMON_TOKEN}
      - DASH_URL=http://0.0.0.0:5050
    networks:
      - homeassistant-net
    depends_on:
      - homeassistant
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Only needed if you want to enable gassistant integration
