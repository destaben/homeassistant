services:
  homeassistant:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:2026.2"
    volumes:
      - ./homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - apparmor:unconfined
      - no-new-privileges:true
    ports:
      - "8123:8123"
    networks:
      - homeassistant-net
    restart: always

  zigbee2mqtt:
    container_name: zigbee2mqtt
    image: koenkk/zigbee2mqtt:2.8.0
    restart: unless-stopped
    volumes:
        - ./data:/app/data
        - /run/udev:/run/udev:ro
    ports:
        - 8082:8080
    environment:
        - TZ=Europe/Madrid
    devices:
        - /dev/serial/by-id/usb-ITead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_fc0671e16fbeed119095a04838a92db5-if00-port0:/dev/ttyACM0
    networks:
      - homeassistant-net

  mosquitto:
    image: eclipse-mosquitto:2.0
    hostname: mosquitto
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./etc_mosquitto:/etc/mosquitto
      - ./mosquitto_config:/mosquitto/config/
    networks:
      - homeassistant-net

