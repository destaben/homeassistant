move_camera_pasillo:
  alias: move_camera_pasillo
  sequence:
  - service: select.select_option
    target:
      entity_id: select.tapo_camera_2f13_move_to_preset
    data:
      option: Entrada
move_camera_salon:
  alias: move_camera_salon
  sequence:
  - service: select.select_option
    target:
      entity_id: select.tapo_camera_2f13_move_to_preset
    data:
      option: Salon
meshtastic_public_broadcast:
  alias: meshtastic_public_broadcast
  fields:
    message:
      required: true
      selector:
        text:
          multiline: false
  mode: queued
  max: 2
  sequence:
  - condition: template
    value_template: "{{ message is string and message | length > 0 and message | length <= 240 }}"
  - action: meshtastic.broadcast_channel_message
    data:
      channel: meshtastic.gateway_d3st_channel_mediumfast
      message: "{{ message }}"
      ack: false
vacuum_clean_all_or_return:
  alias: vacuum_clean_all_or_return
  mode: single
  sequence:
  - choose:
    - conditions:
      - condition: template
        value_template: >-
          {{ states('vacuum.xiaomi_robot_vacuum_x20') in
             ['cleaning', 'paused', 'returning'] }}
      sequence:
      - action: vacuum.return_to_base
        target:
          entity_id: vacuum.xiaomi_robot_vacuum_x20
    default:
    - action: vacuum.start
      target:
        entity_id: vacuum.xiaomi_robot_vacuum_x20
