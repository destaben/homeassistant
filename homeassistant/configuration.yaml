homeassistant:
  customize:
    sensor.meshtastic_d3st_2661074868_stats_nodes_online:
      state_class: measurement
    sensor.meshtastic_d3st_2661074868_stats_nodes_total:
      state_class: measurement
    sensor.d3st_tasa_errores_rf:
      state_class: measurement
      unit_of_measurement: "/min"
    sensor.d3st_tasa_duplicados:
      state_class: measurement
      unit_of_measurement: "/min"
    sensor.d3st_tasa_relay_cancelado:
      state_class: measurement
      unit_of_measurement: "/min"
    sensor.d3st_tasa_rx:
      state_class: measurement
      unit_of_measurement: "/min"
    sensor.d3st_tasa_tx:
      state_class: measurement
      unit_of_measurement: "/min"

lovelace:
  dashboards:
    ui-lovelace:
      mode: yaml
      title: Principal
      icon: mdi:home
      show_in_sidebar: true
      filename: ui-lovelace.yaml
api:
logbook:
history:

recorder:
  purge_keep_days: 90
  include:
    entities:
      - binary_sensor.door_1_contact
      - binary_sensor.motion_1_occupancy
      - binary_sensor.motion_2_occupancy
      - binary_sensor.presence_1_occupancy
      - binary_sensor.window_1_contact
      - binary_sensor.window_2_contact
      - binary_sensor.window_3_contact
      - person.destaben
      - person.carolmontaes
      - switch.smart_plug_1909121534757325186448e1e903790b_outlet
      - switch.smart_plug_1909122087239425186448e1e9039bc1_outlet
      - vacuum.xiaomi_robot_vacuum_x20_sweep_mode
      - fan.zhimi_mc2_8977_air_purifier

assist_pipeline:

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 192.168.1.222
    - 127.0.0.1
    - ::1
    - 172.22.0.0/24
  ip_ban_enabled: true
  login_attempts_threshold: 3

automation: !include automations.yaml
script: !include scripts.yaml

template:
  - binary_sensor:
    - name: "Peak Electricity Hours"
      unique_id: "peak_electricity_hours"
      device_class: power
      state: >
        {% set h = now().hour %}
        {{ (h >= 10 and h < 14) or (h >= 18 and h < 22) }}
    - name: "Predicted Arrival Soon"
      unique_id: "predicted_arrival_soon"
      state: >
        {% set h = now().hour %}
        {% set dow = now().weekday() %}
        {% set in_window = (dow < 5 and h >= 17 and h < 20) or
                           (dow >= 5 and h >= 11 and h < 14) %}
        {{ in_window and states('person.destaben') == 'not_home' }}

sensor:
  # Derivadas de contadores Meshtastic d3st — tasa de cambio (anomalías)
  - platform: derivative
    source: sensor.meshtastic_d3st_2661074868_stats_packets_rx_bad
    name: "d3st Tasa Errores RF"
    unique_id: "d3st_bad_packets_rate"
    round: 2
    unit_time: min
    time_window: "00:05:00"

  - platform: derivative
    source: sensor.meshtastic_d3st_2661074868_stats_packets_rx_duplicate
    name: "d3st Tasa Duplicados"
    unique_id: "d3st_duplicate_packets_rate"
    round: 2
    unit_time: min
    time_window: "00:05:00"

  - platform: derivative
    source: sensor.meshtastic_d3st_2661074868_stats_packets_tx_relay_cancelled
    name: "d3st Tasa Relay Cancelado"
    unique_id: "d3st_relay_cancelled_rate"
    round: 2
    unit_time: min
    time_window: "00:05:00"

  - platform: derivative
    source: sensor.meshtastic_d3st_2661074868_stats_packets_rx
    name: "d3st Tasa RX"
    unique_id: "d3st_rx_rate"
    round: 2
    unit_time: min
    time_window: "00:05:00"

  - platform: derivative
    source: sensor.meshtastic_d3st_2661074868_stats_packets_tx
    name: "d3st Tasa TX"
    unique_id: "d3st_tx_rate"
    round: 2
    unit_time: min
    time_window: "00:05:00"

  - platform: statistics
    name: "d3st Canal Media 1h"
    unique_id: "d3st_canal_media_1h"
    entity_id: sensor.meshtastic_d3st_2661074868_device_channel_utilization
    state_characteristic: mean
    max_age:
      hours: 1
    sampling_size: 1000

  - platform: statistics
    name: "d3st Airtime Media 1h"
    unique_id: "d3st_airtime_media_1h"
    entity_id: sensor.meshtastic_d3st_2661074868_device_airtime
    state_characteristic: mean
    max_age:
      hours: 1
    sampling_size: 1000

  - platform: statistics
    name: "d3st Nodes Online Media 1h"
    unique_id: "d3st_nodes_online_media_1h"
    entity_id: sensor.meshtastic_d3st_2661074868_stats_nodes_online
    state_characteristic: mean
    max_age:
      hours: 1
    sampling_size: 1000

mqtt:
  switch:
    - name: "light_1_mqtt"
      state_topic: "zigbee2mqtt/light_1"
      command_topic: "zigbee2mqtt/light_1/set"
      payload_on: '{"state": "ON"}'
      payload_off: '{"state": "OFF"}'
      state_on: "ON"
      state_off: "OFF"
      value_template: "{{ value_json.state }}"
      qos: 1
      retain: true

