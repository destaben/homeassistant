move_camera_pasillo:
  alias: move_camera_pasillo
  sequence:
  - service: select.select_option
    target:
      entity_id: select.tapo_camera_2f13_move_to_preset
    data:
      option: Entrada
move_camera_salon:
  alias: move_camera_salon
  sequence:
  - service: select.select_option
    target:
      entity_id: select.tapo_camera_2f13_move_to_preset
    data:
      option: Salon

meshtastic_public_broadcast:
  alias: meshtastic_public_broadcast
  mode: single
  fields:
    message:
      required: true
      selector:
        text:
  sequence:
  - service: meshtastic.broadcast_channel_message
    data:
      channel: meshtastic.gateway_d3st_channel_mediumfast
      message: "{{ message }}"
      ack: false
